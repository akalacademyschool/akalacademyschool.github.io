<style>
/* Concept: one continuous 3D world. Each slide is a stage on a long runway; the camera flies between stages while a glass text card sits beside the object. */
:root{
  --bg:#06180f; --bg2:#0b2a1d; --fg:#e9f6ee; --muted:#9db9a9; --accent:#9be7b8; --gold:#f2b84b; --coral:#ee6a55; --leaf:#3fae74;
  --glass:rgba(10,36,25,.62); --line:rgba(155,231,184,.22);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'DM Sans','Segoe UI',system-ui,sans-serif; --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 20%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--fg);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#gl.hov{cursor:pointer}
.ui{position:fixed;inset:0;pointer-events:none;padding-inline:max(16px,3vw)}
.top{position:absolute;left:max(16px,3vw);right:max(16px,3vw);top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .r{display:flex;gap:14px;align-items:center;pointer-events:auto}
.timer{cursor:pointer;font-variant-numeric:tabular-nums;background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;padding:0}
.count{font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.card{box-sizing:border-box;position:absolute;top:calc(50% + 44px);transform:translateY(-50%);width:min(32rem,44vw);max-height:calc(100% - 290px);overflow:auto;padding:28px 30px 26px;border:1px solid var(--line);border-radius:22px;background:var(--glass);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);pointer-events:auto;opacity:0;visibility:hidden;transition:opacity .5s,transform .7s cubic-bezier(.2,.9,.2,1),visibility 0s .5s}
.card.left{left:max(16px,3vw);transform:translate(-40px,-50%)}.card.right{right:max(16px,3vw);transform:translate(40px,-50%)}
.card.on{opacity:1;visibility:visible;transform:translate(0,-50%);transition:opacity .6s .35s,transform .9s .35s cubic-bezier(.2,.9,.2,1),visibility 0s}
.eyebrow{font-family:var(--f-mono);font-size:13.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.card h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,3.7vw,3.3rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.card h2 em{font-style:normal;color:var(--accent)}
.card p{margin:0 0 14px;font-size:clamp(1.08rem,1.4vw,1.25rem);line-height:1.5;color:#d3e8da;max-width:34em}
.card ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.card li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:baseline;font-size:1.12rem;line-height:1.4;color:var(--fg)}
.card li b{font-family:var(--f-mono);font-weight:500;font-size:.9rem;color:var(--bg);background:var(--accent);border-radius:7px;padding:2px 8px;white-space:nowrap}
.card a{color:var(--accent);word-break:break-all}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}.stat{min-width:0;flex:1 1 9rem}.stat strong{display:block;font-family:var(--f-display);font-weight:800;font-size:2.9rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}.stat span{font-size:1rem;color:var(--muted);line-height:1.35;display:block;margin-top:4px}
.quote{font-family:var(--f-display);font-weight:700;font-size:1.4rem;line-height:1.25;color:var(--fg);margin:4px 0 0}
.card .hint{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:16px}
.bottom{position:absolute;left:max(16px,3vw);right:max(16px,3vw);bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;align-items:center;gap:14px;pointer-events:auto}
.btn{appearance:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);width:46px;height:46px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s;flex:none}
.btn:hover{transform:scale(1.1);background:rgba(155,231,184,.2)}.btn:focus-visible,.dot:focus-visible,.pill:focus-visible,.timer:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.dots{display:flex;gap:7px;flex:1;justify-content:center;flex-wrap:wrap;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:rgba(155,231,184,.28);cursor:pointer;transition:all .35s}.dot.on{background:var(--accent);width:30px;border-radius:6px;box-shadow:0 0 14px rgba(155,231,184,.7)}
.pill{appearance:none;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--fg);font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:0 16px;height:46px;border-radius:23px;cursor:pointer;flex:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(155,231,184,.12)}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--gold));transition:width .8s cubic-bezier(.2,.9,.2,1)}
.notes{position:absolute;right:max(16px,3vw);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);width:min(26rem,calc(100% - 32px));padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:rgba(6,24,15,.9);font-size:.95rem;line-height:1.5;color:#d3e8da;pointer-events:auto}
.notes b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:6px}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:12px;pointer-events:none;transition:opacity .8s}

.pangti{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 46px);transform:translateX(-50%);width:min(44rem,calc(100% - 32px));padding:10px 22px 11px;border:1px solid rgba(242,184,75,.45);border-radius:16px;background:rgba(6,24,15,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center;pointer-events:auto;box-shadow:0 14px 40px rgba(0,0,0,.4);transition:opacity .5s}
.pangti .pg{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,2.4vw,1.95rem);line-height:1.4;color:var(--gold);white-space:pre-line;text-wrap:balance}
.pangti .pm{font-size:clamp(.92rem,1.2vw,1.08rem);line-height:1.4;color:#d3e8da;margin-top:2px}
.pangti .pa{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.pangti.hero{padding:14px 26px 14px}.pangti.hero .pg{font-size:clamp(1.7rem,3.5vw,2.8rem)}
.art{margin:-6px -8px 16px;border-radius:14px;overflow:hidden;background:rgba(155,231,184,.07);border:1px solid var(--line)}
.art svg{display:block;width:100%;height:auto}
@media (max-height:900px){.art{display:none}}

/* portfolio additions */
.photo{width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--accent);box-shadow:0 0 26px rgba(155,231,184,.55);display:block;margin:2px 0 14px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.pills span{font-size:.95rem;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(155,231,184,.08);color:var(--fg)}
.pills b{width:100%;font-family:var(--f-mono);font-weight:500;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:6px 0 -2px}
.certgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:12px;max-height:36vh;overflow:auto;padding:2px 4px 2px 2px}
.cert{appearance:none;border:1px solid var(--line);border-radius:12px;background:rgba(155,231,184,.06);padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;transition:transform .2s}
.cert:hover{transform:translateY(-3px);background:rgba(155,231,184,.12)}
.cert img{width:100%;height:74px;object-fit:cover;border-radius:8px;background:#0a2e24}
.cert span{font-size:.68rem;line-height:1.25;color:var(--muted);text-align:center}
#lightbox{position:fixed;inset:0;background:rgba(3,10,7,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;z-index:60;padding:24px;pointer-events:auto}
#lightbox[hidden]{display:none}
.lbbox{max-width:min(880px,94vw);text-align:center}
.lbbox img{max-width:100%;max-height:76vh;border-radius:14px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6)}
#lbcap{margin:12px 0 4px;font-size:1.05rem;color:var(--fg)}
#lbclose{position:absolute;top:18px;right:22px}

@media (max-width:760px){
  .art{display:none}
  .pangti{top:calc(env(safe-area-inset-top,0px) + 42px);padding:7px 12px 8px;border-radius:12px}.pangti .pg{font-size:1.05rem;line-height:1.4}.pangti .pm{font-size:.78rem}.pangti .pa{font-size:10px;margin-top:3px}.pangti.hero .pg{font-size:1.25rem}
  .card{width:calc(100% - 32px);left:16px!important;right:16px!important;top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);max-height:42vh;padding:18px 18px 16px;transform:translateY(30px)!important}
  .card.on{transform:translateY(0)!important}
  .card h2{font-size:1.8rem}.card p{font-size:1.02rem}.card li{font-size:1.02rem}.stat strong{font-size:2.2rem}
  .hint{display:none}.pill .lbl{display:none}.dots{gap:5px}.dot{width:8px;height:8px}.dot.on{width:20px}
  .btn,.pill{width:42px;height:42px;padding:0}
  .notes{bottom:calc(env(safe-area-inset-bottom,0px) + 70px)}
  .certgrid{max-height:26vh}
}
@media (prefers-reduced-motion:reduce){.card,.card.on{transition-duration:.01s!important;transition-delay:0s!important}}

function buildCap(){const g=new THREE.Group();stage(g);
  const med=new THREE.Group();med.position.set(4.6,3.3,0);
  const atex=new THREE.TextureLoader().load(AVATAR);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,.22,48),[mat(0x0f6b4a,.4),new THREE.MeshStandardMaterial({map:atex,roughness:.5,metalness:.05}),mat(0x0f6b4a,.4)]);

  g.add(med);
  const board=new THREE.Mesh(new THREE.BoxGeometry(3.2,.28,3.2),mat(0x0f6b4a,.4));board.position.y=3.6;board.rotation.y=.4;g.add(board);
  const btn=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,.5),mat(0xf2b84b,.3,.4));btn.position.set(0,3.85,0);btn.rotation.y=.4;g.add(btn);
  const tas=new THREE.Group();const cord=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,1.3,10),mat(0xf2b84b,.4));cord.position.y=-.65;tas.add(cord);
  const bob=new THREE.Mesh(new THREE.SphereGeometry(.14,16,16),mat(0xf2b84b,.3));bob.position.y=-1.35;tas.add(bob);tas.position.set(1.6,3.6,0);g.add(tas);
  const head=new THREE.Mesh(new THREE.CylinderGeometry(.9,1,.9,24),mat(0x1f8f5f,.5));head.position.y=2.6;g.add(head);
  const rings=[];[[4.4,.5,0xf2b84b],[5.2,1.0,0x9be7b8]].forEach(([r,tilt,c],k)=>{const grp=new THREE.Group();grp.position.y=3.2;grp.rotation.set(tilt,.3,0);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.05,12,120),mat(c,.25,.5));grp.add(ring);const orb=new THREE.Group();grp.add(orb);
    for(let i=0;i<4;i++){const s=new THREE.Mesh(new THREE.SphereGeometry(.16,16,16),mat(0xf4fbf6,.2));const a=i*1.57;s.position.set(Math.cos(a)*r,Math.sin(a)*r,0);orb.add(s)}
    g.add(grp);rings.push({orb,sp:k?-.4:.55})});
  shadowize(g);
  return{group:g,hov:[board,btn,disc],update(t,p){board.rotation.y=.4+t*.2;btn.rotation.y=.4+t*.2;tas.rotation.z=Math.sin(t*1.8)*.25;tas.rotation.x=Math.cos(t*1.3)*.15;head.position.y=2.6+Math.sin(t*1.2)*.08;rings.forEach(r=>r.orb.rotation.z=t*r.sp);
  med.rotation.y=dragRY+t*.25;med.rotation.x=clamp(dragRX,-.6,.6);med.position.y=3.3+Math.sin(t*1.2)*.15}}}
function buildBook(){const g=new THREE.Group();stage(g);

  const cl=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,3.4),covM);L.add(cl);
  const cr=new THREE.Mesh(new THREE.BoxGeometry(2.6,.12,3.4),covM);R.add(cr);
  for(let i=0;i<3;i++){const pl=new THREE.Mesh(new THREE.BoxGeometry(2.4,.05,3.2),pgM);pl.position.y=.12+i*.09;L.add(pl);
    const pr=new THREE.Mesh(new THREE.BoxGeometry(2.4,.05,3.2),pgM);pr.position.y=.12+i*.09;R.add(pr)}
  L.position.set(-1.25,2.6,0);L.rotation.z=.28;R.position.set(1.25,2.6,0);R.rotation.z=-.28;g.add(L,R);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.5,20,20),new THREE.MeshBasicMaterial({color:0x9be7b8,transparent:true,opacity:.5}));glow.position.y=4.4;g.add(glow);
  shadowize(g);
  return{group:g,hov:[cl,cr],update(t,p){const k=ease(clamp(p*1.2));L.rotation.z=.28+.1*Math.sin(t*1.2);R.rotation.z=-.28-.1*Math.sin(t*1.2);L.position.y=R.position.y=2.6+Math.sin(t*1.4)*.15;glow.scale.setScalar((0.6+0.4*k)*(1+Math.sin(t*3)*.12));g.rotation.y=Math.sin(t*.4)*.15}}}
function buildBars(){const g=new THREE.Group();stage(g);const bars=[];const cs=[0x0f6b4a,0x1f8f5f,0x3fae74,0x7ac96b,0xf2b84b,0xee6a55];const hs=[2,3.4,2.6,4.4,3.2,5];
  hs.forEach((h,i)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mat(cs[i],.3,.1));const x=(i-2.5)*1.5;m.position.x=x;g.add(m);bars.push({m,h,i,x})});
  shadowize(g);
  return{group:g,hov:bars.map(b=>b.m),update(t,p){bars.forEach(b=>{const k=bk(stag(p,b.i,6,.55));const w=1+Math.sin(t*2+b.i*1.3)*.12;const hh=Math.max(.05,b.h*k*w);b.m.scale.y=hh;b.m.position.set(b.x,hh/2,0)})}}}

function buildPapers(){const g=new THREE.Group();stage(g);const sheets=[];

function buildNetwork(){const g=new THREE.Group();stage(g);const N=10,nodes=[],cs=[0x0f6b4a,0x1f8f5f,0x3fae74,0x7ac96b,0xc8d94a,0xf2b84b];
  const hub=new THREE.Mesh(new THREE.IcosahedronGeometry(1,2),mat(0xf4fbf6,.2,.25));hub.position.y=3.2;g.add(hub);
  for(let i=0;i<N;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.4+(i%3)*.1,32,32),mat(cs[i%6],.3));g.add(m);const c=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,1,8),new THREE.MeshBasicMaterial({color:0x9be7b8,transparent:true,opacity:.7}));g.add(c);
    const pulse=new THREE.Mesh(new THREE.SphereGeometry(.12,12,12),new THREE.MeshBasicMaterial({color:0xf2b84b}));g.add(pulse);nodes.push({m,c,pulse,i})}
  shadowize(g);
  return{group:g,hov:nodes.map(n=>n.m).concat([hub]),update(t,p){hub.rotation.set(t*.4,t*.6,0);hub.scale.setScalar(1+Math.sin(t*2)*.06);const R=4.4*ease(clamp(p*1.15));
    nodes.forEach(n=>{const a=n.i/N*Math.PI*2+t*.2;n.m.position.set(Math.cos(a)*R,3.2+Math.sin(n.i*2.1+t)*.7,Math.sin(a)*R*.75);const from=hub.position,d=n.m.position.clone().sub(from),len=d.length();
      n.c.position.copy(from).add(d.clone().multiplyScalar(.5));n.c.scale.set(1,len,1);n.c.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
      const k=((t*.35+n.i*.13)%1);n.pulse.position.copy(from).add(d.clone().multiplyScalar(k));n.pulse.scale.setScalar(.6+Math.sin(k*Math.PI)*.8)})}}}

function start(){

/* ---------- build world ---------- */
const stations=S.map((s,i)=>{const st=s.build();st.group.position.x=i*STEP;st.group.visible=i<2;scene.add(st.group);st.spring={s:0,v:0};st.i=i;return st});
// ambient particles along the runway
const PN=1400,pg=new THREE.BufferGeometry(),pp=new Float32Array(PN*3),pc=new Float32Array(PN*3),pv=[];
const pal=[new THREE.Color(0x9be7b8),new THREE.Color(0xf2b84b),new THREE.Color(0x7ac96b),new THREE.Color(0xf4fbf6)];
for(let i=0;i<PN;i++){pp[i*3]=(Math.random()*(S.length+1)-.5)*STEP;pp[i*3+1]=Math.random()*22-2;pp[i*3+2]=-30+Math.random()*50;const c=pal[i%4];pc.set([c.r,c.g,c.b],i*3);pv.push(Math.random()*.4+.1)}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));pg.setAttribute('color',new THREE.BufferAttribute(pc,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.14,vertexColors:true,transparent:true,opacity:.75,depthWrite:false,sizeAttenuation:true}));scene.add(pts);
// confetti burst
const CN=160,cg=new THREE.BufferGeometry(),cpos=new Float32Array(CN*3),cvel=[],cc=new Float32Array(CN*3);
for(let i=0;i<CN;i++){cvel.push(new THREE.Vector3());const c=pal[i%4];cc.set([c.r,c.g,c.b],i*3)}
cg.setAttribute('position',new THREE.BufferAttribute(cpos,3));cg.setAttribute('color',new THREE.BufferAttribute(cc,3));
const conf=new THREE.Points(cg,new THREE.PointsMaterial({size:.32,vertexColors:true,transparent:true,opacity:1,depthWrite:false}));conf.visible=false;scene.add(conf);let confT=-1,confO=new THREE.Vector3();
function burst(x,y,z){confO.set(x,y,z);for(let i=0;i<CN;i++){cpos.set([x,y,z],i*3);cvel[i].set((Math.random()-.5)*14,Math.random()*11+3,(Math.random()-.5)*14)}cg.attributes.position.needsUpdate=true;confT=0;conf.visible=true}

/* ---------- UI ---------- */
const cardsEl=document.getElementById('cards'),dotsEl=document.getElementById('dots'),notesEl=document.getElementById('notes');
S.forEach((s,i)=>{const c=document.createElement('section');c.className='card '+s.side;c.setAttribute('aria-label','Slide '+(i+1));c.innerHTML=`${ARTS[i]?'<div class="art">'+ART[ARTS[i]]()+'</div>':''}<p class="eyebrow">${s.eyebrow}</p><h2>${s.title}</h2><p>${s.body}</p>${s.extra||''}`;cardsEl.appendChild(c);s.el=c;
  const d=document.createElement('button');d.className='dot';d.setAttribute('aria-label','Go to slide '+(i+1));d.onclick=()=>go(i);dotsEl.appendChild(d);s.dot=d});
const countEl=document.getElementById('count'),barEl=document.getElementById('barfill'),pad=n=>String(n).padStart(2,'0');

/* ---------- certificate grid + lightbox ---------- */
const CERTS=[["jaafr-confirmation.jpg","JAAFR Research Paper Confirmation"],["hr-internship.jpg","HR Internship Certificate"],["campus-ambassador.jpg","Campus Ambassador, Wayspire"],["iira-data-analysis.jpg","Data Analysis, IIRA"],["tcs-soft-skills.jpg","Soft Skills, TCS"],["hp-leadership.jpg","Effective Leadership, HP"],["gemini-workspace.jpg","Gemini for Google Workspace"],["icil-2026.jpg","ICIL 2026 Participation"],["national-conference.jpg","National Conference"],["seminar-certificate.jpg","Seminar Certificate"],["iti-copa.jpg","ITI COPA Certificate, NIPS"],["ai-book-chapter.jpg","AI for Industry, Education & Research (Book Chapter)"],["jaafr-certificate.jpg","JAAFR Certificate of Publication"],["udemy-leadership.jpg","Educational Leadership & Academic Practice, Udemy"],["iira-python.jpg","Data Analysis Using Python, IIRA"],["iks-presentation.jpg","Paper Presentation — National Conference on Indian Knowledge System"]];
const LB=document.getElementById('lightbox');
function openLB(src,cap){if(!src)return;document.getElementById('lbimg').src=src;document.getElementById('lbcap').textContent=cap;LB.hidden=false}
function closeLB(){LB.hidden=true}
document.getElementById('lbclose').onclick=closeLB;
LB.addEventListener('click',e=>{if(e.target===LB)closeLB()});
(function(){const g=document.getElementById('certgrid');if(!g)return;const IM=window.CERT_IMGS||{};
  CERTS.forEach(([f,cap])=>{const b=document.createElement('button');b.className='cert';b.setAttribute('aria-label',cap);
    const im=document.createElement('img');im.src=IM[f]||'';im.alt=cap;im.loading='lazy';
    const sp=document.createElement('span');sp.textContent=cap;b.append(im,sp);b.onclick=()=>openLB(IM[f],cap);g.appendChild(b)})})();

/* ---------- camera flight ---------- */
let cur=-1,prev=-1,flight=null;const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let offX=0,offY=0,tOffX=0,tOffY=0;
function target(i){const s=S[i];return{p:new THREE.Vector3(i*STEP+s.cam[0],s.cam[1]*1.25,s.cam[2]*1.32),l:new THREE.Vector3(i*STEP,s.look,0)}}
function go(i,instant){i=clamp(i,0,S.length-1);if(i===cur)return;const first=cur<0;prev=cur;cur=i;
  S.forEach((s,k)=>{s.el.classList.toggle('on',k===i);s.dot.classList.toggle('on',k===i);if(k===i)s.dot.setAttribute('aria-current','true');else s.dot.removeAttribute('aria-current')});
  countEl.textContent=pad(i+1)+' / '+pad(S.length);barEl.style.width=((i+1)/S.length*100)+'%';
  if(!notesEl.hidden)notesEl.innerHTML='<b>Speaker notes</b>'+S[i].notes;
  const q=QUOTES[i],pe=document.getElementById('pangti');pe.classList.toggle('hero',!!q.hero);pe.children[0].textContent=q.g;pe.children[1].textContent=q.m;pe.children[2].textContent=q.a;
  try{history.replaceState(null,'','#s'+(i+1))}catch(e){}
  const T=target(i);
  if(first||instant){camPos.copy(T.p);camLook.copy(T.l);flight=null}
  else{flight={t:0,dur:RM?.01:2.1,fp:camPos.clone(),fl:camLook.clone(),tp:T.p,tl:T.l}}
  if(!first)startTimer();
  stations[i].group.visible=true;if(prev>=0)stations[prev].group.visible=true;
  if(i===S.length-1||i===0&&!first){}
  if(i===S.length-1&&!RM){setTimeout(()=>burst(i*STEP,3.5,0),1500)}
  updateOffsets()}
function updateOffsets(){const w=innerWidth,h=innerHeight;if(w<=760){tOffX=0;tOffY=h*.2}else{tOffX=(S[cur].side==='left'?-1:1)*w*.0;tOffY=0;tOffX=(S[cur].side==='left'?-w*.17:w*.17)}}
document.getElementById('prev').onclick=()=>go(cur-1);document.getElementById('next').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();go(cur+1)}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='n'||e.key==='N')toggleNotes();else if(e.key==='f'||e.key==='F')fs();else if(e.key==='Escape'&&!LB.hidden)closeLB()});
function toggleNotes(){notesEl.hidden=!notesEl.hidden;document.getElementById('notesBtn').setAttribute('aria-pressed',String(!notesEl.hidden));if(!notesEl.hidden)notesEl.innerHTML='<b>Speaker notes</b>'+S[cur].notes}
document.getElementById('notesBtn').onclick=toggleNotes;
function fs(){try{if(document.fullscreenElement){document.exitFullscreen()}else{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{})}}catch(e){}}
document.getElementById('fsBtn').onclick=fs;
let t0=null,tmr=document.getElementById('timer');function startTimer(){if(t0===null)t0=performance.now()}
tmr.onclick=()=>{t0=null;tmr.textContent='00:00'};
setInterval(()=>{if(t0!==null){const s=Math.floor((performance.now()-t0)/1000);tmr.textContent=pad(Math.floor(s/60))+':'+pad(s%60)}},500);
// swipe
let sx=null,dragging=false,lx=0,ly=0,dragRX=0,dragRY=0;
canvas.addEventListener('pointerdown',e=>{sx=e.clientX;mouseDown=true;if(e.pointerType!=='touch'){dragging=true;lx=e.clientX;ly=e.clientY}});
addEventListener('pointerup',e=>{mouseDown=false;dragging=false;if(sx!==null&&e.pointerType==='touch'){const dx=e.clientX-sx;if(Math.abs(dx)>60)go(cur+(dx<0?1:-1))}sx=null});let mouseDown=false;
canvas.addEventListener('pointermove',e=>{if(dragging&&cur===0){dragRY+=(e.clientX-lx)*.008;dragRX=clamp(dragRX+(e.clientY-ly)*.005,-.6,.6);lx=e.clientX;ly=e.clientY}});

/* ---------- pointer: parallax + hover + click pop ---------- */
const ray=new THREE.Raycaster(),mp=new THREE.Vector2(9,9);let px=0,py=0,hovered=null;const pops=new WeakMap();
addEventListener('pointermove',e=>{mp.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);px=mp.x;py=mp.y});
canvas.addEventListener('click',()=>{if(hovered){const p=pops.get(hovered)||{s:1,v:0};p.v+=9;pops.set(hovered,p);burstSmall(hovered)}});
function burstSmall(m){const w=new THREE.Vector3();m.getWorldPosition(w);if(!RM)burst(w.x,w.y+1,w.z)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<760?50:38;camera.updateProjectionMatrix();if(cur>=0)updateOffsets()}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
const clock=new THREE.Clock();let T=0;
function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);T+=dt;
  // flight
  if(flight){flight.t+=dt;const k=clamp(flight.t/flight.dur),e=ease(k);const lift=Math.sin(Math.PI*e);
    camPos.lerpVectors(flight.fp,flight.tp,e);camPos.y+=lift*5;camPos.z+=lift*10;camLook.lerpVectors(flight.fl,flight.tl,e);camera.fov=(innerWidth<760?50:38)+lift*(RM?0:12);camera.updateProjectionMatrix();
    if(k>=1){flight=null;if(prev>=0&&prev!==cur)stations[prev].group.visible=false;camera.fov=innerWidth<760?50:38;camera.updateProjectionMatrix()}}
  const rp=camPos.clone();rp.x+=px*(RM?0:1.2);rp.y+=py*(RM?0:.7)+Math.sin(T*.5)*(RM?0:.1);camera.position.copy(rp);camera.lookAt(camLook);
  offX+=(tOffX-offX)*Math.min(1,dt*3);offY+=(tOffY-offY)*Math.min(1,dt*3);camera.setViewOffset(innerWidth,innerHeight,offX,offY,innerWidth,innerHeight);
  // lights follow
  key.position.set(camLook.x+8,14,9);key.target.position.set(camLook.x,0,0);rimA.position.set(camLook.x-9,6,6);rimB.position.set(camLook.x+9,7,-4);
  // stations
  stations.forEach(st=>{const g=st.group;if(!g.visible)return;const sp=st.spring,tgt=st.i===cur?1:0;const f=(tgt-sp.s)*80-sp.v*10;sp.v+=f*dt;sp.s+=sp.v*dt;if(RM){sp.s=tgt;sp.v=0}
    const sc=Math.max(.001,.25+.75*sp.s);g.scale.setScalar(sc);const p=clamp(sp.s*1.0,0,1.2);st.update(T,Math.min(p,1.0));
    st.hov.forEach(m=>{let pp=pops.get(m);if(!pp){pp={s:1,v:0};pops.set(m,pp)}const tg=m===hovered?1.14:1;const ff=(tg-pp.s)*120-pp.v*9;pp.v+=ff*dt;pp.s+=pp.v*dt;})});
  // hover scale applied multiplicatively to group-level child via userData-safe approach
  const act=stations[cur>=0?cur:0];
  if(act){ray.setFromCamera(mp,camera);const hit=ray.intersectObjects(act.hov,true);let h=null;if(hit.length){let o=hit[0].object;while(o&&!act.hov.includes(o))o=o.parent;h=o}hovered=h;canvas.classList.toggle('hov',!!h);
  }
  // particles drift
  const pa=pg.attributes.position;for(let i=0;i<PN;i++){let y=pa.array[i*3+1]+pv[i]*dt*(RM?0:1);if(y>20)y=-2;pa.array[i*3+1]=y}pa.needsUpdate=true;
  // confetti
  if(confT>=0){confT+=dt;const a=cg.attributes.position;for(let i=0;i<CN;i++){cvel[i].y-=12*dt;a.array[i*3]+=cvel[i].x*dt;a.array[i*3+1]+=cvel[i].y*dt;a.array[i*3+2]+=cvel[i].z*dt}a.needsUpdate=true;conf.material.opacity=Math.max(0,1-confT/2.2);if(confT>2.2){confT=-1;conf.visible=false}}
  renderer.render(scene,camera)}
// hover/click pop: applied after each station update
stations.forEach(st=>{const u=st.update;st.hov.forEach(m=>{m.userData.base=m.scale.clone();m.userData.last=m.scale.clone()});
  st.update=function(t,p){u(t,p);st.hov.forEach(m=>{const pp=pops.get(m);if(!pp)return;const ud=m.userData;
    if(m.scale.equals(ud.last))m.scale.copy(ud.base).multiplyScalar(pp.s);else m.scale.multiplyScalar(pp.s);ud.last.copy(m.scale)})}});
let startIdx=0;const m=/^#s(\d+)$/.exec(location.hash);if(m)startIdx=clamp(+m[1]-1,0,S.length-1);
go(startIdx,true);stations.forEach(st=>{if(st.i===cur){st.spring.s=0;st.spring.v=0;st.group.visible=true}});
const L=document.getElementById('loading');setTimeout(()=>{L.style.opacity=0},300);
frame();
}
Promise.race([document.fonts?document.fonts.load('800 80px "Bricolage Grotesque"'):Promise.resolve(),new Promise(r=>setTimeout(r,2500))]).then(start,start);
})();
